<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes - Day 4</title>
    <!-- Link the CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Link the JavaScript with defer -->
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <button id="theme-toggle">Dark mode</button>
    </header>

    <main>
        <section>
            <h2>Write your note</h2>
            <textarea id="note-text" placeholder="Start typing your note here..."></textarea>
            
            <div class="counters">
                <p id="char-count">0 / 200 characters</p>
                <p id="word-count">0 words</p>
            </div>

            <button id="clear-btn">Clear</button>
        </section>
    </main>
</body>
</html>
